<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
    <defs>
      <linearGradient id="metalBase" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e2e8f0"/>
        <stop offset="50%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
      <linearGradient id="glassTube" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="rgba(56,189,248,0.45)"/>
        <stop offset="35%" stop-color="rgba(224,242,254,0.65)"/>
        <stop offset="70%" stop-color="rgba(14,165,233,0.25)"/>
        <stop offset="100%" stop-color="rgba(2,132,199,0.55)"/>
      </linearGradient>
      <linearGradient id="backPanel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
    </defs>
    <!-- Drop Shadow -->
    <ellipse cx="128" cy="276" rx="74" ry="34" fill="rgba(0,0,0,0.42)"/>
    <!-- Isometric Base Tray -->
    <polygon points="128,232 204,268 128,304 52,268" fill="url(#metalBase)" stroke="#334155" stroke-width="2.5"/>
    <polygon points="52,268 128,304 128,314 52,278" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <polygon points="204,268 128,304 128,314 204,278" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <!-- Drain Grid -->
    <polygon points="128,244 180,268 128,292 76,268" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Rear Spine Wall -->
    <polygon points="128,56 176,80 176,256 128,232" fill="url(#backPanel)" stroke="#334155" stroke-width="2"/>
    <polygon points="80,80 128,56 128,232 80,256" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <!-- Glowing Sonic Rings -->
    <ellipse cx="128" cy="130" rx="54" ry="22" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 4" opacity="0.85"/>
    <ellipse cx="128" cy="175" rx="54" ry="22" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="10 5" opacity="0.85"/>
    <ellipse cx="128" cy="220" rx="54" ry="22" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75"/>
    <!-- Frosted Curved Glass Cylinder -->
    <path d="M64,84 C64,60 192,60 192,84 L192,258 C192,286 64,286 64,258 Z" fill="url(#glassTube)" stroke="#bae6fd" stroke-width="2"/>
    <!-- Specular Glass Highlight -->
    <path d="M78,90 L78,252" stroke="rgba(255,255,255,0.65)" stroke-width="5" stroke-linecap="round"/>
    <path d="M90,95 L90,256" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-linecap="round"/>
    <!-- Top Canopy Dome -->
    <polygon points="128,36 204,72 128,108 52,72" fill="url(#metalBase)" stroke="#1e293b" stroke-width="2.5"/>
    <ellipse cx="128" cy="72" rx="46" ry="20" fill="#0284c7" stroke="#e0f2fe" stroke-width="2"/>
    <ellipse cx="128" cy="72" rx="32" ry="13" fill="#38bdf8"/>
    <!-- Digital Temp Control Panel -->
    <rect x="142" y="142" width="22" height="36" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="153" cy="154" r="5" fill="#22d3ee"/>
    <line x1="147" y1="168" x2="159" y2="168" stroke="#34d399" stroke-width="2.5"/>
  </svg>