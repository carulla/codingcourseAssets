<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
    <defs>
      <linearGradient id="cinemaGlow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e1b4b"/>
        <stop offset="45%" stop-color="#831843"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
    </defs>
    <ellipse cx="210" cy="272" rx="145" ry="40" fill="rgba(236,72,153,0.28)"/>
    <!-- Outer Cinema Truss Frame -->
    <polygon points="56,36 364,172 364,292 56,156" fill="#0f172a" stroke="#ec4899" stroke-width="4"/>
    <!-- Giant Projection Canvas -->
    <polygon points="70,50 350,174 350,276 70,152" fill="url(#cinemaGlow)" stroke="#f472b6" stroke-width="2"/>
    <!-- Scene Illustration Inside Screen (Sci-Fi Horizon & Subtitles) -->
    <circle cx="175" cy="136" r="28" fill="#fbbf24" opacity="0.85"/>
    <polygon points="90,154 165,125 245,190 330,185 330,260 90,154" fill="rgba(15,23,42,0.75)"/>
    <!-- Subtitle Caption Bar -->
    <polygon points="115,164 305,248 305,262 115,178" fill="rgba(255,255,255,0.85)"/>
  </svg>