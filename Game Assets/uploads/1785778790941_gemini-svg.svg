  <text x="170" y="542" font-family="Courier New, monospace" font-weight="bold" font-size="13" fill="#1e1e1e" text-anchor="middle">👥 20 STUDENTS</text>
  <text x="170" y="558" font-family="Courier New, monospace" font-weight="bold" font-size="11" fill="#7fba00" text-anchor="middle">WIN CONDITION</text>

  <rect x="310" y="520" width="180" height="50" fill="#ff5252" stroke="#1e1e1e" stroke-width="3" rx="6"/>
  <text x="400" y="542" font-family="Courier New, monospace" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">🧀 CHEESE TOUCH</text>
