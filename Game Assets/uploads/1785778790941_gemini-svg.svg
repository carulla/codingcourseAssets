    <rect x="344" y="310" width="32" height="35" fill="#3498db" stroke="#1e1e1e" stroke-width="4"/>
    <line x1="352" y1="345" x2="320" y2="395" stroke="#1e1e1e" stroke-width="5" stroke-linecap="round"/>
    <line x1="368" y1="345" x2="400" y2="380" stroke="#1e1e1e" stroke-width="5" stroke-linecap="round"/>
